name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test source and packed npm artifact
        run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/clean-code benchmark --manifest harness/calibration/benchmark-manifest.yaml
      - run: go run ./cmd/clean-code compare-workflows
      - run: go run ./cmd/clean-code benchmark-full-flow
      - run: go test -race ./examples/benchmark-flow/...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o clean-code-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/clean-code
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
